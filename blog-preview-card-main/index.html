<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>


  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body {
      background-color: #F4D04E;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }
    .blog-preview {
      display: flex;
      flex: 1;
      justify-content: center;
      align-items: center;
    }
    .card {
      background-color: white;
      border: solid 1px #111111;
      border-radius: 20px;
      box-shadow: 8px 8px  #000000;
      box-sizing: border-box;
      width: fit-content;
      max-width: 384px;
      font-family: "Figtree", sans-serif;
      line-height: 1.5;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 0 24px 0 24px;
      overflow: hidden;
    }
    .blog_info {
      display: flex;
      flex-direction: column;
      gap: 12px;

    }
    .blog_image {
      display: block;
      width: 100%;
      height: 200px;
      border-radius: 10px;
      object-fit: cover;
    }
    .badge {
      background-color: #F4D04E;
      width: fit-content;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 800;
      color: #111111;
    }
    .date {
      width: fit-content;
      color: #111111;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      font-weight: 500;
    }
    h2 {
      margin: 0;
      color: #111111;
      font-size: clamp(1.25rem, 1.6667vw, 1.5rem);
      font-weight: 800;
    }
    h2:hover {
      color: #F4D04E;
      cursor: url('assets/images/cursor.png'), pointer;
    }
    .description {
      color: #6B6B6B;
      font-size: clamp(0.875rem, 1.1111vw, 1rem);
      font-weight: 500;
      margin: 0;
      width: 21em;
    }
    .author {
      color: #111111;
      font-size: 0.875rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .author img {
      width: 32px;
      height: 32px;
    }


  </style>
</head>
<body>
<main class="blog-preview">
  <article class="card">
    <img class="blog_image" src="assets/images/illustration-article.svg" alt="Illustration article for blog card" >

    <div class="blog_info">
      <div class="badge">Learning</div>

      <time datetime="2023-12-21" class="date">Published 21 Dec 2023</time>

      <h2 class="title">
        HTML & CSS foundations
      </h2>

      <p class="description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>
    </div>

    <div class="author">
      <img src="assets/images/image-avatar.webp" alt="Avatar of Greg Hooper" class="avatar">
      <span class="author-name">Greg Hooper</span>
    </div>
  </article>
</main>
<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
  Coded by <a href="https://github.com/iggysav/FrontMentor">Iggysav</a>.
</footer>
</body>
</html>
