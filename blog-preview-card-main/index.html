<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>


  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    h2, p, time, .badge {
      margin: 0;
    }
    body {
        background-color: #F4D04E;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        margin: 0;
    }
    .blog-preview {
        display: flex;
        flex: 1;
        justify-content: center;
        align-items: center;
    }
    .card {
        background-color: white;
        border: solid 1px #111111;
        border-radius: 20px;
        box-shadow: 8px 8px  #000000;
        box-sizing: border-box;
        max-width: 384px;
        font-family: "Figtree", sans-serif;
        padding: 24px;
      display: flex;
      flex-direction: column;
    }
    .blog_image {
        display: block;
        width: 100%;
    }

    .author img {
      width: 32px;
      height: 32px;
      float: left;
      padding-right: 12px;
    }

    .bot-12 {
      padding-bottom: 12px;
    }
    .bot-24 {
      padding-bottom: 24px;
    }

  </style>
</head>
<body>
  <main class="blog-preview">
    <article class="card">
      <img src="assets/images/illustration-article.svg" alt="Illustration article for blog card" class="blog_image bot-24">

      <div class="badge bot-12">Learning</div>

      <time datetime="2023-12-21" class="date bot-12">Published 21 Dec 2023</time>

      <h2 class="title bot-12">
        HTML & CSS foundations
      </h2>

      <p class="description bot-24">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>

      <div class="author">
        <img src="assets/images/image-avatar.webp" alt="Avatar of Greg Hooper" class="avatar">
        <span class="author-name">Greg Hooper</span>
      </div>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/iggysav/FrontMentor">Iggysav</a>.
  </footer>
</body>
</html>
