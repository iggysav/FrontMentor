<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>


  <main class="card">
    <div class="box box--image">
      <img class="product-avatar" src="images/image-product-desktop.jpg" alt="A bottle of perfume CHANEL Gabrielle">
    </div>
    <article class="box box--info">
      <span class="product__category">Perfume</span>

      <h1 class="product__title"> Gabrielle Essence Eau De Parfum</h1>

      <p class="product__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>

      <div class="product__price">
        <span class="new_price">$149.99</span>
        <s>$169.99</s>
      </div>

      <button class="product__button">Add to Cart</button>
    </article>

  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/iggysav/FrontMentor/tree/master/blog-preview-card-main">Iggysav</a>.
  </footer>
</body>
</html>
