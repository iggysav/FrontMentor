<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=EB+Garamond:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .attribution { font-size: 0.6875rem; text-align: center; }
        .attribution a { color: hsl(228, 45%, 44%); }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
        }
        .content {

            flex: 1;
            justify-content: center;
            align-items: center;
        }
        .older {
            list-style: none;
            margin: 0 auto;
            width: 660px;
            counter-reset: li;
        }
        .older li {
            border-bottom: dashed 1px #006699;
            margin-top: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 40px rgba(0, 0, 0, 0.1) inset;
            padding: 5px;
        }
        .older a {
            text-decoration: none;
            padding: 10px;
            display: block;
            line-height: 30px;
            color: #3A3A3A;
            font-family: 'EB Garamond', serif;
            font-size: 20px;
            font-weight: bold;
        }
        .older a:before {
            display: inline-block;
            content: counter(li);
            counter-increment: li;
            height: 30px;
            width: 30px;
            text-align: center;
            border: solid 1px #dedede;
            margin-right: 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3), 0 0 30px rgba(0, 0, 0, 0.1) inset;
            font-family: 'Fredericka the Great', cursive;
            font-size: 24px;
            font-weight: normal;
            -webkit-transition: .4s linear;
            transition: .4s linear;
        }
        .older a:hover:before {
            color:#D72F2C;
            -webkit-transform: scale(1.1);
            transform: scale(1.1);
            cursor: pointer ;
        }
        .older a:hover {
            text-decoration: underline;
        }
        h1 {
            text-align: center;
        }
    </style>

</head>
<body>
    <main class="content">
        <h1>Frontend Mentor Challenges</h1>
        <ul class="older">
            <li><a href="https://iggysav.github.io/FrontMentor/qr-code-component-main">QR-code component</a></li>
            <li><a href="https://iggysav.github.io/FrontMentor/blog-preview-card-main">Blog preview card</a></li>
        </ul>
    </main>
    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="https://github.com/iggysav/FrontMentor">Iggysav</a>.
    </footer>
</body>
</html>
