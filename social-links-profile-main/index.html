<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>


  <style>

    :root {
      --color-bg-page: #141414;
      --color-bg-card: #1F1F1F;
      --color-bg-button: #333333;
      --color-accent: #C4F82A;
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #333333;
    }

    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }

    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body {
      background-color: var(--color-bg-page);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: "Inter", sans-serif;
      color: var(--color-text-primary);

    }
    .profile-preview {
      flex: 1;
    }
    .card {
      flex-direction: column;
      gap: 24px;
      background-color: var(--color-bg-card);
      border-radius: 12px;
      box-sizing: border-box;
      width: min(calc(100% - 80px), 384px);
      line-height: 1.5;
      padding: 40px;
      overflow: hidden;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .person {
      flex-direction: column;
      gap: 4px;
    }
    .address {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-accent);
    }
    .profile-avatar{
      border-radius: 50%;
      width: 88px;
    }
    .profession {
      font-size: 0.875rem;
      font-weight: 400;
    }
    .social-links {
      font-size: 0.875rem;
      font-weight: bold;
      align-self: stretch;
    }
    .social-links ul {
      display: flex;
      flex-direction: column;
      gap: 16px;
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    .social-links ul li {
      padding: 0;
      background-color: var(--color-bg-button);
      border-radius: 8px;
      text-align: center;
    }
    .social-links a {
      display: block;
      color: inherit;
      text-decoration: none;
      padding: 12px 0;
      transition: background-color 0.5s ease, color 0.5s ease;
      border-radius: 8px;
    }

    .social-links a:hover {
      cursor: url('assets/images/handcursor_black.svg'), pointer;
      background-color: var(--color-accent);
      color: var(--color-text-secondary);
    }
    .social-links a:focus-visible {
      color: var(--color-text-secondary);
      outline: 1px solid var(--color-text-secondary);
      background-color: var(--color-accent);
    }

  </style>
</head>
<body>
<main class="profile-preview flex-center">
  <article class="card flex-center">
    <img class="profile-avatar" src="assets/images/avatar-jessica.jpeg" alt="" >
    <div class="person flex-center">
      <h1>Jessica Randall</h1>
      <div class="address">London, United Kingdom</div>
    </div>
    <div class="profession">"Front-end developer and avid reader."</div>

    <div class="social-links">
      <ul>
        <li><a href="#">GitHub</a></li>
        <li><a href="#">Frontend Mentor</a></li>
        <li><a href="#">LinkedIn</a></li>
        <li><a href="#">Twitter</a></li>
        <li><a href="#">Instagram</a></li>
      </ul>
    </div>
  </article>
</main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/iggysav/FrontMentor/tree/master/blog-preview-card-main">Iggysav</a>.
  </footer>
</body>
</html>
